<!DOCTYPE html>
<html>
<head>
    <title>Lab 7 Homework</title>
    <meta charset="utf-8" />

    <!-- CSS link for ArcGIS API and for and dropdown menu styling  -->
    <link rel="stylesheet" href="style.css/popup_styles.css"/>
    <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css"/>
    <script src="https://js.arcgis.com/4.30/"></script>

    <!-- Code to display tornado touchdown locations in continental USA using an ArcGIS API -->
    <script>
      require(["esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer", "esri/layers/GraphicsLayer", "esri/geometry/Point", "esri/geometry/geometryEngine"], function (Map, MapView, FeatureLayer, GraphicsLayer, Point, geometryEngine) {
        var TransportationLayer = new FeatureLayer({
          url: "https://services.arcgis.com/V6ZHFr6zdgNZuVG0/ArcGIS/rest/services/1950_2017_tornado_touchdown_locations/FeatureServer/0"
        });

        var resultsLayer = new GraphicsLayer();
          map.add(resultsLayer);

        // Code displays the basemap for the information to display on
        var map = new Map({
          basemap: "streets-navigation-vector",
          layers: [TransportationLayer, resultsLayer]
        });

        // This centers the map on a certain location and zooms it to correctly display all of the data
        var view = new MapView({
          container: "viewDiv",
          map: map,
          zoom: 4,
          center: [-95.601174, 38.370305]
        });
      });

      // This code adds a copyright to the bottom of the map pane.
      <div id="copyright">
        <script>
          var today = new Date()
          var year = today.getFullYear()
          document.writeln("Copyright &copy;" + year)
        </script>
      </div>
    </script>
    <script>
    view.when(function(){
      view.ui.add("optionsDiv", "bottom-right");
      on(dom.byId("doBtn"), "click", doQuery);
    });
    var attributeName = dom.byId("attSelect");
    var expressionSign = dom.byId("signSelect");
    var value = dom.byId("valSelect");
    function doQuery() {
      resultsLayer.removeAll();

      var coords = document.getElementById("townSelect").value.split(",");
      var longitude = Number(coords[0]);
      var latitude = Number(coords[1]);
      var radius = Number(document.getElementById("radiusSelect").value);

      var townPoint = new Point({
        longitude: longitude,
        latitude: latitude
      });

      var searchArea = geometryEngine.geodesicBuffer(
        townPoint, radius, "miles"
      );

      document.getElementById("printResults").textContent =
        "Searching for tornado locations...";

      TransportationLayer.queryFeatures({
        geometry: searchArea,
        spatialRelationship: "intersects",
        returnGeometry: true,
        outFields: ["*"]
      }).then(getResults).catch(promiseRejected);
    }

    function getResults(response) {
      var popResults = response.features;

      popResults.forEach(function(feature) {
        feature.popupTemplate = popupTemplate;
      });

      resultsLayer.addMany(popResults);

      var radius = document.getElementById("radiusSelect").value;

      document.getElementById("printResults").textContent =
        popResults.length + " tornado touchdown records found within " +
        radius + " miles.";

      if (popResults.length > 0) {
        view.goTo(popResults).then(function() {
          view.popup.open({
            features: popResults,
            featureMenuOpen: true,
            updateLocationEnabled: true
          });
        }).catch(function(error) {
          if (error.name !== "AbortError") {
            console.error("Map navigation error:", error);
          }
        });
      } else {
        view.popup.close();

        var coords = document.getElementById("townSelect").value.split(",");
        var townPoint = new Point({
          longitude: Number(coords[0]),
          latitude: Number(coords[1])
        });

        view.goTo({
          target: townPoint,
          zoom: 9
        });
      }
    }

    function promiseRejected(error) {
      console.error("Query failed:", error);

      document.getElementById("printResults").textContent =
        "Unable to retrieve tornado locations.";
    }
    view.when(function() {
      document.getElementById("doBtn").addEventListener("click", doQuery);

      TransportationLayer.load().then(function() {
        document.getElementById("printResults").textContent =
          "Map ready. Choose a town and search radius.";
      }).catch(promiseRejected);
    });
  });
  </script>
</head>
<body>
  <div id="body-container">
    <div id="header">
      <h1>Map of Tornado Dropdown Locations from 1950-2017</h1>
    </div>
  </div>
    <div id="viewDiv"></div>

      <div class="dropdown">
        <button class="dropbtn">HTML Files</button>
        <div class="dropdown-content">
          <a href="https://idg39.github.io/simple_mapping.html" target="_blank">Simple Mapping HTML</a>
          <a href="https://idg39.github.io/tile_layer.html" target="_blank">Tile Layer HTML</a>
          <a href="https://idg39.github.io/dynamic_layers.html" target="_blank">Dynamic Layers HTML</a>
          <a href="https://idg39.github.io/on_event.html" target="_blank">On Event HTML</a>
          <a href="https://idg39.github.io/basemap_gallery.html" target="_blank">Basemap Gallery HTML</a>
          <a href="https://idg39.github.io/query_task.html" target="_blank">Query Task HTML</a>
        </div>
      </div>
  <label for="townSelect">Choose a town:</label>
  <select id="townSelect">
    <option value="-97.3259,37.7059">Wichita, Kansas</option>
    <option value="-96.8049,46.8677">Fargo, North Dakota</option>
    <option value="-97.5164,35.4676">Oklahoma City, Oklahoma</option>
  </select>
  <label for="radiusSelect">Search radius:</label>
  <select id="radiusSelect">
    <option value="10">10 miles</option>
    <option value="25" selected>25 miles</option>
    <option value="50">50 miles</option>
    <option value="100">100 miles</option>
  </select>
  <button id="doBtn">Find nearby tornadoes</button>
  <p id="printResults">Choose a town and search radius.</p>
</body>
</html>
